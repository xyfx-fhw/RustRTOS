<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343842" />
      <stop offset="100%" stop-color="#1d2025" />
    </linearGradient>
    <linearGradient id="rust-color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f56000" />
      <stop offset="100%" stop-color="#c83f00" />
    </linearGradient>
  </defs>

  <!-- MCU Pins -->
  <g fill="#7d818a">
    <!-- Top Pins -->
    <rect x="110" y="32" width="24" height="40" rx="6" />
    <rect x="183" y="32" width="24" height="40" rx="6" />
    <rect x="256" y="32" width="24" height="40" rx="6" transform="translate(-12, 0)"/>
    <rect x="305" y="32" width="24" height="40" rx="6" />
    <rect x="378" y="32" width="24" height="40" rx="6" />
    
    <!-- Bottom Pins -->
    <rect x="110" y="440" width="24" height="40" rx="6" />
    <rect x="183" y="440" width="24" height="40" rx="6" />
    <rect x="256" y="440" width="24" height="40" rx="6" transform="translate(-12, 0)"/>
    <rect x="305" y="440" width="24" height="40" rx="6" />
    <rect x="378" y="440" width="24" height="40" rx="6" />
    
    <!-- Left Pins -->
    <rect x="32" y="110" width="40" height="24" rx="6" />
    <rect x="32" y="183" width="40" height="24" rx="6" />
    <rect x="32" y="256" width="40" height="24" rx="6" transform="translate(0, -12)"/>
    <rect x="32" y="305" width="40" height="24" rx="6" />
    <rect x="32" y="378" width="40" height="24" rx="6" />
    
    <!-- Right Pins -->
    <rect x="440" y="110" width="40" height="24" rx="6" />
    <rect x="440" y="183" width="40" height="24" rx="6" />
    <rect x="440" y="256" width="40" height="24" rx="6" transform="translate(0, -12)"/>
    <rect x="440" y="305" width="40" height="24" rx="6" />
    <rect x="440" y="378" width="40" height="24" rx="6" />
  </g>

  <!-- MCU Body -->
  <rect x="64" y="64" width="384" height="384" rx="48" fill="url(#chip-bg)" stroke="#454b56" stroke-width="8" />

  <!-- Inner Chip Square -->
  <rect x="120" y="120" width="272" height="272" rx="24" fill="#0f1115" stroke="#25282e" stroke-width="6" />

  <!-- Rust OS Symbol : 'R' in the center -->
  <text x="256" y="333" font-family="'Trebuchet MS', 'Courier New', monospace" font-size="220" font-weight="900" fill="url(#rust-color)" text-anchor="middle">R</text>

  <!-- Circuit Traces linking core to outer body -->
  <g stroke="#3a3d45" stroke-width="6" stroke-linecap="round">
    <path d="M 120 256 L 80 256" />
    <path d="M 392 256 L 432 256" />
    <path d="M 256 120 L 256 80" />
    <path d="M 256 392 L 256 432" />
    
    <path d="M 152 120 L 152 90 L 122 90" fill="none" />
    <path d="M 360 120 L 360 90 L 390 90" fill="none" />
    <path d="M 152 392 L 152 422 L 122 422" fill="none" />
    <path d="M 360 392 L 360 422 L 390 422" fill="none" />
  </g>
  
  <!-- Pin 1 Dot Marker -->
  <circle cx="104" cy="104" r="10" fill="url(#rust-color)" />
</svg>
