<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea5b2d" />
      <stop offset="100%" stop-color="#c63d14" />
    </linearGradient>
  </defs>

  <!-- MCU Pins (Evenly distributed, centered at 128, 192, 256, 320, 384) -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Top Pins -->
    <rect x="112" y="32" width="32" height="48" rx="8" />
    <rect x="176" y="32" width="32" height="48" rx="8" />
    <rect x="240" y="32" width="32" height="48" rx="8" />
    <rect x="304" y="32" width="32" height="48" rx="8" />
    <rect x="368" y="32" width="32" height="48" rx="8" />
    
    <!-- Bottom Pins -->
    <rect x="112" y="432" width="32" height="48" rx="8" />
    <rect x="176" y="432" width="32" height="48" rx="8" />
    <rect x="240" y="432" width="32" height="48" rx="8" />
    <rect x="304" y="432" width="32" height="48" rx="8" />
    <rect x="368" y="432" width="32" height="48" rx="8" />
    
    <!-- Left Pins -->
    <rect x="32" y="112" width="48" height="32" rx="8" />
    <rect x="32" y="176" width="48" height="32" rx="8" />
    <rect x="32" y="240" width="48" height="32" rx="8" />
    <rect x="32" y="304" width="48" height="32" rx="8" />
    <rect x="32" y="368" width="48" height="32" rx="8" />
    
    <!-- Right Pins -->
    <rect x="432" y="112" width="48" height="32" rx="8" />
    <rect x="432" y="176" width="48" height="32" rx="8" />
    <rect x="432" y="240" width="48" height="32" rx="8" />
    <rect x="432" y="304" width="48" height="32" rx="8" />
    <rect x="432" y="368" width="48" height="32" rx="8" />
  </g>

  <!-- MCU Body (Orange) -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="url(#chip-bg)" />

  <!-- Inner border/accent -->
  <rect x="96" y="96" width="320" height="320" rx="32" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3" />

  <!-- Rust OS Symbol : 'R' in the center -->
  <text x="254" y="342" font-family="'Trebuchet MS', 'Courier New', sans-serif" font-size="240" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>

</svg>
