<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea5b2d" />
      <stop offset="100%" stop-color="#c63d14" />
    </linearGradient>
  </defs>

  <!-- MCU Pins (White/Very Light Gray to stand out on dark background) -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Top Pins -->
    <rect x="110" y="32" width="32" height="48" rx="8" />
    <rect x="183" y="32" width="32" height="48" rx="8" />
    <rect x="256" y="32" width="32" height="48" rx="8" transform="translate(-16, 0)"/>
    <rect x="329" y="32" width="32" height="48" rx="8" />
    <rect x="370" y="32" width="32" height="48" rx="8" />
    
    <!-- Bottom Pins -->
    <rect x="110" y="432" width="32" height="48" rx="8" />
    <rect x="183" y="432" width="32" height="48" rx="8" />
    <rect x="256" y="432" width="32" height="48" rx="8" transform="translate(-16, 0)"/>
    <rect x="329" y="432" width="32" height="48" rx="8" />
    <rect x="370" y="432" width="32" height="48" rx="8" />
    
    <!-- Left Pins -->
    <rect x="32" y="110" width="48" height="32" rx="8" />
    <rect x="32" y="183" width="48" height="32" rx="8" />
    <rect x="32" y="256" width="48" height="32" rx="8" transform="translate(0, -16)"/>
    <rect x="32" y="329" width="48" height="32" rx="8" />
    <rect x="32" y="370" width="48" height="32" rx="8" />
    
    <!-- Right Pins -->
    <rect x="432" y="110" width="48" height="32" rx="8" />
    <rect x="432" y="183" width="48" height="32" rx="8" />
    <rect x="432" y="256" width="48" height="32" rx="8" transform="translate(0, -16)"/>
    <rect x="432" y="329" width="48" height="32" rx="8" />
    <rect x="432" y="370" width="48" height="32" rx="8" />
  </g>

  <!-- MCU Body (Orange) -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="url(#chip-bg)" />

  <!-- Inner border/accent -->
  <rect x="96" y="96" width="320" height="320" rx="32" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3" />

  <!-- Rust OS Symbol : 'R' in the center -->
  <text x="254" y="342" font-family="'Trebuchet MS', 'Courier New', sans-serif" font-size="240" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>

</svg>
